name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sukisu-susfs
            backend: sukisu
            mode: builtin
          - variant: sukisu-resusfs
            backend: sukisu
            mode: none
          - variant: kernelsu-susfs
            backend: kernelsu
            mode: builtin
          - variant: kernelsu-resusfs
            backend: kernelsu
            mode: none
          - variant: ksunext-susfs
            backend: ksunext
            mode: builtin
          - variant: ksunext-resusfs
            backend: ksunext
            mode: none

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/lib/google-cloud-sdk
          sudo apt-get clean
          df -h /

      - name: Add swap
        run: |
          # The runner image already uses /swapfile, so create a separate file.
          sudo fallocate -l 8G /swapfile-onyx || \
            sudo dd if=/dev/zero of=/swapfile-onyx bs=1M count=8192
          sudo chmod 600 /swapfile-onyx
          sudo mkswap /swapfile-onyx
          sudo swapon /swapfile-onyx
          free -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential cpio curl device-tree-compiler dwarves \
            flex git kmod libelf-dev libssl-dev lz4 python3 rsync unzip zip \
            zstd clang-18 lld-18 llvm-18

      - name: Build kernel
        run: bash scripts/build.sh
        env:
          ROOT_BACKEND: ${{ matrix.backend }}
          SUSFS_MODE: ${{ matrix.mode }}

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: onyx-${{ matrix.variant }}
          if-no-files-found: error
          path: artifacts/${{ matrix.variant }}/

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.variant }}
          if-no-files-found: ignore
          path: artifacts/${{ matrix.variant }}/build.log
